name: BAYAR AMAN Android APK
on:
  workflow_dispatch:
  push:
    branches: [review/bayar-aman-recovery]
    paths:
      - 'android/**'
      - 'index.html'
      - 'admin.html'
      - 'user.js'
      - 'admin.js'
      - 'route.js'
      - 'app.css'
      - 'config.js'
      - 'vendor/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle approved web UI locally in both APKs
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html admin.html user.js admin.js route.js app.css config.js icons.svg android/app/src/main/assets/
          cp -r vendor android/app/src/main/assets/
      - name: Build two debug APKs
        working-directory: android
        run: |
          curl -fLsS https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle --no-daemon :app:assembleUserDebug :app:assembleAdminDebug
      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: BAYAR-AMAN-USER-debug
          path: android/app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: BAYAR-AMAN-ADMIN-debug
          path: android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
          retention-days: 7
