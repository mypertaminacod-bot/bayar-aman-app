name: BAYAR AMAN checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [review/bayar-aman-recovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enforce approved User and Admin design and flow lock
        run: node tests/design-lock.cjs
      - run: npm test
      - name: Test database migrations in isolated local PostgreSQL
        run: npm run test:db
      - name: Install Chromium for mobile-browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Test User and Admin browser flows (simulated Supabase)
        run: |
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name headless_shell \) | head -n 1)
          if [ -z "$CHROME" ]; then echo 'Chromium executable missing'; exit 1; fi
          mkdir -p screenshots
          SCREENSHOT_DIR="$PWD/screenshots" CHROMIUM_PATH="$CHROME" npm run test:browser
      - name: Upload actual mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayar-aman-mobile-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Package User and Admin preview
        run: |
          mkdir -p preview
          cp index.html admin.html user.js admin.js route.js app.css config.js icons.svg preview/
          cp -r vendor preview/
          cd preview && zip -qr ../bayar-aman-preview.zip .
      - name: Upload Android browser preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bayar-aman-user-admin-preview
          path: bayar-aman-preview.zip
          retention-days: 7

  android:
    name: Build User and Admin Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using runner SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle User and Admin web pages
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html admin.html user.js admin.js route.js app.css config.js icons.svg android/app/src/main/assets/
          cp -r vendor android/app/src/main/assets/
      - name: Download Gradle and build both debug APKs
        working-directory: android
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle --no-daemon :app:assembleUserDebug :app:assembleAdminDebug
      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: BAYAR-AMAN-USER-debug
          path: android/app/build/outputs/apk/user/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: BAYAR-AMAN-ADMIN-debug
          path: android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
          retention-days: 7
