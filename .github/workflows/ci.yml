name: BAYAR AMAN checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [review/bayar-aman-recovery]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test database migrations in isolated local PostgreSQL
        run: npm run test:db
      - name: Install Chromium for mobile-browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Test User and Admin browser flows (simulated Supabase)
        env:
          CHROMIUM_PATH: /home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome
        run: |
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux*/chrome' | head -n 1)
          if [ -z "$CHROME" ]; then echo 'Chromium executable missing'; exit 1; fi
          CHROMIUM_PATH="$CHROME" npm run test:browser
      - name: Package User and Admin preview
        run: |
          mkdir -p preview
          cp index.html admin.html user.js admin.js route.js app.css config.js icons.svg preview/
          cd preview && zip -q ../bayar-aman-preview.zip *
      - name: Upload Android browser preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bayar-aman-user-admin-preview
          path: bayar-aman-preview.zip
          retention-days: 7
