plugins { id 'com.android.application' }
android {
  namespace 'id.bayaraman.mobile'
  compileSdk 35
  defaultConfig { applicationId 'id.bayaraman.mobile'; minSdk 24; targetSdk 35; versionCode 1; versionName '0.1.0' }
  flavorDimensions 'role'
  productFlavors {
    user { dimension 'role'; applicationIdSuffix '.user'; resValue 'string', 'app_name', 'BAYAR AMAN User'; buildConfigField 'String', 'START_PAGE', '"index.html"' }
    admin { dimension 'role'; applicationIdSuffix '.admin'; resValue 'string', 'app_name', 'BAYAR AMAN Admin'; buildConfigField 'String', 'START_PAGE', '"admin.html"' }
  }
  buildFeatures { buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
